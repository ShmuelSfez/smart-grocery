<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <style>
    body { width: 356px; margin: 0; font: 14px system-ui, "Segoe UI", Arial, sans-serif; color: #1d1d1f; }
    header { background: #0f766e; color: #fff; padding: 12px 14px; font-weight: 700; font-size: 15px; }
    header small { display: block; font-weight: 400; font-size: 11px; opacity: .92; margin-top: 3px; line-height: 1.35; }
    section { padding: 10px 14px; border-bottom: 1px solid #eee; }
    h4 { margin: 0 0 6px; font-size: 13px; color: #6e6e73; }
    button, select { font: inherit; border: 1px solid #ddd; background: #fff; border-radius: 10px; padding: 8px 10px; cursor: pointer; }
    select { flex: 1; min-width: 0; font-size: 13px; }
    .primary { background: #0f766e; color: #fff; border-color: #0f766e; font-weight: 600; width: 100%; }
    .primary:hover { background: #115e59; }
    textarea { width: 100%; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; font: 12px monospace; direction: ltr; padding: 6px; }
    .maps { max-height: 200px; overflow: auto; }
    .map { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px solid #f2f2f2; font-size: 12px; }
    .map img { width: 28px; height: 28px; object-fit: contain; }
    .map .g { flex: 1; min-width: 0; }
    .map .g div { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .map .x { border: 0; background: none; color: #aaa; padding: 2px 6px; }
    .map .x:hover { color: #dc2626; }
    .muted { color: #6e6e73; font-size: 12px; }
    .row { display: flex; gap: 6px; align-items: center; }
    .mt-8 { margin-top: 8px; }
    .mt-6 { margin-top: 6px; }
  </style>
</head>
<body>
  <header>
    🛒 העגלה החכמה (v3.1)
    <small>שופרסל · רמי לוי · קרפור · מחסני השוק · ויקטורי · יוחננוף · טיב טעם (לא רשמי)</small>
  </header>
  <section>
    <div id="pendingInfo" class="muted"></div>
    <div class="row mt-8"><button class="primary" id="open">פתח את הרשת עם החלונית</button></div>
  </section>
  <section>
    <h4>ייבוא ידני של קישור סל</h4>
    <textarea id="code" rows="3" placeholder="הדבק כאן קישור סל מהאפליקציה (…#smartlist=…)"></textarea>
    <div class="row mt-6">
      <select id="chainSelect" aria-label="בחירת רשת">
        <option value="auto">זיהוי אוטומטי מהקישור</option>
        <option value="shufersal">שופרסל אונליין</option>
        <option value="ramilevy">רמי לוי באינטרנט</option>
        <option value="carrefour">קרפור ישראל</option>
        <option value="mahsaneihashuk">מחסני השוק אונליין</option>
        <option value="victory">ויקטורי אונליין</option>
        <option value="yochananof">יוחננוף אונליין</option>
        <option value="tivtaam">טיב טעם בקליק</option>
      </select>
      <button id="import">טען ופתח</button>
    </div>
  </section>
  <section>
    <h4 id="mapsTitle">מוצרים שמורים</h4>
    <div id="maps" class="maps"></div>
  </section>
  <script src="codec.js"></script>
  <script src="popup.js"></script>
</body>
</html>
